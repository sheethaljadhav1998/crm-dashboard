name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove API routes (not supported by static export)
        run: rm -rf src/app/api
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          REPO_NAME: ${{ github.event.repository.name }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.REQRES_BASE_URL }}
          NEXT_PUBLIC_REQRES_API_KEY: ${{ secrets.REQRES_PUBLIC_API_KEY }}
          NEXT_PUBLIC_AVATAR_BASE_URL: ${{ secrets.NEXT_PUBLIC_AVATAR_BASE_URL }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4